<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="./manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>건강행동 실천 앱</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>
  
  <!-- Pretendard & FontAwesome Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --primary-dark: #3730A3;
      --success: #10B981;
      --success-light: #ECFDF5;
      --warning: #F59E0B;
      --warning-light: #FFFBEB;
      --danger: #EF4444;
      --danger-light: #FEF2F2;
      --bg-main: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.1), 0 8px 10px -6px rgba(79, 70, 229, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #E2E8F0; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0; }
    
    .app-container { 
      width: 100%; 
      max-width: 440px; 
      height: 100vh;
      max-height: 920px;
      background: var(--bg-main); 
      border-radius: var(--radius-lg); 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); 
      position: relative;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .app-container { border-radius: 0; max-height: 100vh; }
    }

    .screen { display: none; padding: 24px; animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 1. 로그인 화면 */
    .login-wrapper { display: flex; flex-direction: column; height: 100%; justify-content: center; padding-top: 20px; }
    .brand-icon { width: 68px; height: 68px; background: linear-gradient(135deg, var(--primary), #818CF8); border-radius: 22px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; margin-bottom: 20px; box-shadow: var(--shadow-md); }
    .login-header h2 { font-size: 1.8rem; color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }
    .login-header p { font-size: 0.98rem; color: var(--text-sub); margin-top: 6px; margin-bottom: 30px; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    .input-group .input-wrapper { position: relative; }
    .input-group .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 1.1rem; }
    .input-group input { width: 100%; padding: 16px 16px 16px 48px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: all 0.2s; background: white; }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    
    .auto-login { display: flex; align-items: center; gap: 10px; margin: 20px 0 30px; cursor: pointer; user-select: none; }
    .auto-login input { width: 20px; height: 20px; accent-color: var(--primary); border-radius: 6px; cursor: pointer; }
    .auto-login span { font-size: 0.95rem; font-weight: 600; color: var(--text-sub); }
    
    .btn-main { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-main:active { transform: scale(0.98); opacity: 0.95; }
    
    /* 2. 메인 화면 */
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .user-profile h3 { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
    .user-profile p { font-size: 0.9rem; color: var(--text-sub); margin-top: 2px; }
    .btn-icon-logout { background: white; border: 1.5px solid var(--border); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
    .btn-icon-logout:active { background: var(--border); }

    /* 대시보드 카드 */
    .dashboard-card { background: linear-gradient(135deg, #4F46E5, #3730A3); border-radius: var(--radius-lg); padding: 24px; color: white; margin-bottom: 28px; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
    .dashboard-card::after { content: ''; position: absolute; right: -20px; bottom: -20px; width: 140px; height: 140px; background: rgba(255, 255, 255, 0.08); border-radius: 50%; pointer-events: none; }
    
    .dashboard-flex { display: flex; align-items: center; justify-content: space-between; }
    .progress-info h4 { font-size: 0.95rem; opacity: 0.85; font-weight: 500; margin-bottom: 8px; }
    .progress-info .percent { font-size: 2.3rem; font-weight: 800; line-height: 1; }
    .progress-info .status-text { font-size: 0.85rem; margin-top: 10px; background: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; display: inline-block; backdrop-filter: blur(4px); font-weight: 600; }

    .circle-chart-container { position: relative; width: 110px; height: 110px; }
    .circle-chart { width: 100%; height: 100%; transform: rotate(-90deg); }
    .circle-bg { fill: none; stroke: rgba(255, 255, 255, 0.2); stroke-width: 4; }
    .circle-progress { fill: none; stroke: #34D399; stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .circle-inner-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.6rem; color: white; }

    /* 목표 리스트 */
    .section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 16px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    .section-title span { font-size: 0.85rem; color: var(--primary); font-weight: 700; background: var(--primary-light); padding: 4px 10px; border-radius: 12px; }

    .target-list { display: flex; flex-direction: column; gap: 14px; }
    .target-item { background: white; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow-sm); }
    .target-item:hover { border-color: var(--primary); transform: translateY(-2px); }
    
    /* 목표 아이템 상태 스타일 */
    .target-item.status-done { border-color: rgba(16, 185, 129, 0.4); background: #F0FDF4; }
    .target-item.status-half { border-color: rgba(245, 158, 11, 0.4); background: #FFFBEB; }
    .target-item.status-fail { border-color: rgba(239, 68, 68, 0.4); background: #FEF2F2; }

    .target-left { display: flex; align-items: center; gap: 14px; }
    .status-icon-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 0.95rem; font-weight: 800; color: var(--text-sub); }
    
    .target-item.status-done .status-icon-circle { background: var(--success); border-color: var(--success); color: white; }
    .target-item.status-half .status-icon-circle { background: var(--warning); border-color: var(--warning); color: white; }
    .target-item.status-fail .status-icon-circle { background: var(--danger); border-color: var(--danger); color: white; }

    .target-info h5 { font-size: 1.05rem; color: var(--text-main); font-weight: 700; }
    .target-info p { font-size: 0.82rem; color: var(--text-sub); margin-top: 2px; }

    /* 3. 질문 및 응답 제출 화면 */
    .header-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .btn-back { background: white; border: 1.5px solid var(--border); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
    .header-bar h3 { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }

    .question-card { background: white; border-radius: var(--radius-md); padding: 22px; margin-bottom: 20px; border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); }
    .question-card .tag { font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; background: var(--primary-light); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
    .question-card h4 { font-size: 1.25rem; color: var(--text-main); font-weight: 800; margin-bottom: 8px; }
    .question-card p { font-size: 0.98rem; color: var(--text-sub); line-height: 1.5; }

    /* 3가지 대표 선택지 버튼 */
    .status-select { display: flex; gap: 8px; margin-bottom: 20px; }
    .status-btn { flex: 1; padding: 16px 8px; border: 2px solid var(--border); border-radius: var(--radius-md); background: white; font-size: 0.92rem; font-weight: 700; color: var(--text-sub); cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .status-btn i { font-size: 1.3rem; }
    
    .status-btn.selected-success { border-color: var(--success); background: var(--success-light); color: var(--success); }
    .status-btn.selected-warning { border-color: var(--warning); background: var(--warning-light); color: var(--warning); }
    .status-btn.selected-fail { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }

    textarea { width: 100%; height: 130px; padding: 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 0.98rem; outline: none; margin-bottom: 24px; resize: none; background: white; transition: 0.2s; }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. 로그인 화면 -->
    <div id="screen-login" class="screen active">
      <div class="login-wrapper">
        <div class="brand-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <div class="login-header">
          <h2>건강행동 실천</h2>
          <p>오늘의 건강한 습관을 기록해 보세요</p>
        </div>
        
        <div class="input-group">
          <label>개인코드</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="loginCode" placeholder="예: 260730000001">
          </div>
        </div>
        
        <div class="input-group">
          <label>성명</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="loginName" placeholder="예: 홍길동">
          </div>
        </div>
        
        <div class="input-group">
          <label>전화번호</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone"></i>
            <input type="text" id="loginPhone" placeholder="숫자만 입력 (예: 01012345678)">
          </div>
        </div>
        
        <div class="input-group">
          <label>생년월일</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-calendar"></i>
            <input type="text" id="loginBirth" placeholder="8자리 (예: 20000101)">
          </div>
        </div>
        
        <label class="auto-login">
          <input type="checkbox" id="autoLoginCheck" checked>
          <span>로그인 상태 유지</span>
        </label>
        
        <button class="btn-main" onclick="handleLogin()">
          <span>시작하기</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- 2. 메인 화면 -->
    <div id="screen-main" class="screen">
      <div class="user-header">
        <div class="user-profile">
          <h3 id="welcomeText">홍길동님, 반가워요! 👋</h3>
          <p id="todayDateText">2026년 7월 30일 목요일</p>
        </div>
        <button class="btn-icon-logout" onclick="logout()" title="로그아웃">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <!-- 프로그레스 대시보드 -->
      <div class="dashboard-card">
        <div class="dashboard-flex">
          <div class="progress-info">
            <h4>오늘의 목표 달성률</h4>
            <div class="percent" id="progressPercent">0%</div>
            <div class="status-text" id="progressSummary">0개 성공 · 0개 보통 · 0개 실패</div>
          </div>
          <div class="circle-chart-container">
            <svg class="circle-chart" viewBox="0 0 36 36">
              <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path id="circleProgress" class="circle-progress" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <i class="fa-solid fa-fire circle-inner-icon"></i>
          </div>
        </div>
      </div>

      <!-- 목표 목록 섹션 -->
      <div class="section-title">
        오늘의 미션
        <span id="targetCountBadge">총 0개</span>
      </div>
      <div id="targetListArea" class="target-list">
        <!-- 목표 항목 동적 삽입 -->
      </div>
    </div>

    <!-- 3. 상세 응답 제출 화면 -->
    <div id="screen-detail" class="screen">
      <div class="header-bar">
        <button class="btn-back" onclick="showScreen('screen-main')">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h3>기록하기</h3>
      </div>

      <div class="question-card">
        <span class="tag">TODAY MISSION</span>
        <h4 id="detailTargetTitle">목표 제목</h4>
        <p id="detailQuestion">관리자 추가 질문 내용이 나타납니다.</p>
      </div>

      <!-- 요청하신 3가지 대표 선택지 -->
      <div class="status-select">
        <div id="btnStatusDone" class="status-btn" onclick="selectStatus('완벽실천')">
          <i class="fa-solid fa-circle-check"></i>
          <span>완벽실천</span>
        </div>
        <div id="btnStatusHalf" class="status-btn" onclick="selectStatus('조금아쉽')">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>조금아쉽</span>
        </div>
        <div id="btnStatusFail" class="status-btn" onclick="selectStatus('내일실천')">
          <i class="fa-solid fa-circle-xmark"></i>
          <span>내일실천</span>
        </div>
      </div>

      <!-- 추가 질문 서술 및 필수 입력 안내 -->
      <textarea id="answerInput" placeholder="추가 질문에 대한 대답을 작성해 주세요. (필수 입력 항목입니다)"></textarea>

      <button class="btn-main" onclick="submitResponse()">
        <i class="fa-solid fa-paper-plane"></i>
        <span>제출하기</span>
      </button>
    </div>

  </div>

  <script>
    // 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./firebase-messaging-sw.js')
          .then((reg) => console.log('서비스 워커 등록 성공:', reg.scope))
          .catch((err) => console.error('서비스 워커 등록 실패:', err));
      });
    }

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDQpqwltPiJtcMMrmA8TQAks1b3RbR_lvA",
      authDomain: "mhrl-goaltrack.firebaseapp.com",
      databaseURL: "https://mhrl-goaltrack-default-rtdb.firebaseio.com",
      projectId: "mhrl-goaltrack",
      storageBucket: "mhrl-goaltrack.firebasestorage.app",
      messagingSenderId: "204480953444",
      appId: "1:204480953444:web:912cae81416f690bdd7371"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messaging = firebase.messaging();

    const VAPID_KEY = "BIefkNza3itCRQ9WRPw51-b5H8ehkC8tQbcqI_YR5e97IqfD6w9TBOkp1X8A_BE7-vg14cBXAkIJyrwR_T-DZ48";

    function requestAndSaveFcmToken(userCode) {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) return;

      Notification.requestPermission().then((permission) => {
        if (permission === 'granted') {
          messaging.getToken({ vapidKey: VAPID_KEY }).then((currentToken) => {
            if (currentToken) {
              db.ref('Users/' + userCode + '/fcmToken').set(currentToken);
            }
          }).catch((err) => console.error('FCM 토큰 오류:', err));
        }
      });
    }

    messaging.onMessage((payload) => {
      const title = payload.notification ? payload.notification.title : '건강행동 실천 알림';
      const body = payload.notification ? payload.notification.body : '';
      
      if (Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: './MHRL%20icon.png' });
      } else {
        alert(`[${title}]\n${body}`);
      }
    });

    let currentUser = null;
    let currentTargets = {};
    let currentResponses = {};
    let selectedTargetKey = null;
    let selectedStatus = '완벽실천';

    const todayStr = new Date().toISOString().substring(0, 10);

    window.onload = function() {
      const savedUser = localStorage.getItem('goalTrackUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        loadMainPage();
        if (currentUser && currentUser.code) {
          requestAndSaveFcmToken(currentUser.code);
        }
      } else {
        showScreen('screen-login');
      }
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function handleLogin() {
      const code = document.getElementById('loginCode').value.trim();
      const name = document.getElementById('loginName').value.trim();
      const phone = document.getElementById('loginPhone').value.trim();
      const birth = document.getElementById('loginBirth').value.trim();

      if (!code || !name || !phone || !birth) {
        alert("모든 정보를 입력해 주세요.");
        return;
      }

      db.ref('Users/' + code).once('value', snapshot => {
        if (!snapshot.exists()) {
          alert("존재하지 않는 개인코드입니다.");
          return;
        }

        const user = snapshot.val();
        if (user.name === name && user.phone === phone && user.birth === birth) {
          currentUser = user;
          if (document.getElementById('autoLoginCheck').checked) {
            localStorage.setItem('goalTrackUser', JSON.stringify(user));
          }
          requestAndSaveFcmToken(currentUser.code);
          loadMainPage();
        } else {
          alert("입력하신 정보가 일치하지 않습니다.");
        }
      });
    }

    function logout() {
      localStorage.removeItem('goalTrackUser');
      location.reload();
    }

    function loadMainPage() {
      showScreen('screen-main');
      document.getElementById('welcomeText').innerText = `${currentUser.name}님, 반가워요! 👋`;
      
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('todayDateText').innerText = new Date().toLocaleDateString('ko-KR', options);

      db.ref('Targets/' + currentUser.code).on('value', targetSnap => {
        currentTargets = targetSnap.val() || {};
        
        db.ref(`Responses/${todayStr}/${currentUser.code}`).on('value', respSnap => {
          currentResponses = respSnap.val() || {};
          renderTargetsAndProgress();
        });
      });
    }

    function renderTargetsAndProgress() {
      const listArea = document.getElementById('targetListArea');
      listArea.innerHTML = '';

      let totalCount = 0;
      let doneCount = 0; // 완벽실천
      let halfCount = 0; // 조금아쉽
      let failCount = 0; // 내일실천

      Object.keys(currentTargets).forEach(key => {
        const t = currentTargets[key];
        let title = typeof t === 'object' ? t.title : t;
        let startDate = typeof t === 'object' ? t.startDate : '';
        let endDate = typeof t === 'object' ? t.endDate : '';
        let active = typeof t === 'object' ? (t.active !== undefined ? t.active : true) : true;

        if (!active) return;
        if (startDate && todayStr < startDate) return;
        if (endDate && todayStr > endDate) return;

        totalCount++;

        const responseObj = currentResponses[key];
        let statusStr = responseObj ? responseObj.status : '';
        
        // 기존 '완료했어요!' 레거시 데이터 호환성 보장
        if (statusStr === '완료했어요!') statusStr = '완벽실천';
        if (statusStr === '못했어요' || statusStr === '오늘은 못했어요') statusStr = '내일실천';

        let iconSymbol = '<i class="fa-solid fa-minus"></i>';
        let statusClass = '';
        let statusText = '터치하여 기록하기';

        if (statusStr === '완벽실천') {
          doneCount++;
          iconSymbol = '<i class="fa-solid fa-check"></i>'; // 체크
          statusClass = 'status-done';
          statusText = '완벽실천 완료!';
        } else if (statusStr === '조금아쉽') {
          halfCount++;
          iconSymbol = '△'; // 세모
          statusClass = 'status-half';
          statusText = '조금아쉽 기록 완료';
        } else if (statusStr === '내일실천') {
          failCount++;
          iconSymbol = '<i class="fa-solid fa-xmark"></i>'; // 엑스
          statusClass = 'status-fail';
          statusText = '내일실천 기록 완료';
        }

        const div = document.createElement('div');
        div.className = `target-item ${statusClass}`;
        div.onclick = () => openDetail(key, title, t.question || '오늘 목표 행동을 실천하셨나요?');

        div.innerHTML = `
          <div class="target-left">
            <div class="status-icon-circle">
              ${iconSymbol}
            </div>
            <div class="target-info">
              <h5>${title}</h5>
              <p>${statusText}</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-sub); font-size: 0.85rem;"></i>
        `;
        listArea.appendChild(div);
      });

      // 프로그레스 바 계산 (완벽실천 100%, 조금아쉽 50% 반영)
      const calculatedScore = doneCount + (halfCount * 0.5);
      const percent = totalCount > 0 ? Math.round((calculatedScore / totalCount) * 100) : 0;
      
      document.getElementById('circleProgress').setAttribute('stroke-dasharray', `${percent}, 100`);
      document.getElementById('progressPercent').innerText = `${percent}%`;
      document.getElementById('progressSummary').innerText = `${doneCount}개 성공 · ${halfCount}개 보통 · ${failCount}개 실패`;
      document.getElementById('targetCountBadge').innerText = `총 ${totalCount}개`;
    }

    function openDetail(key, title, question) {
      selectedTargetKey = key;
      document.getElementById('detailTargetTitle').innerText = title;
      document.getElementById('detailQuestion').innerText = question;

      const existing = currentResponses[key];
      if (existing) {
        let st = existing.status;
        if (st === '완료했어요!') st = '완벽실천';
        if (st === '못했어요' || st === '오늘은 못했어요') st = '내일실천';
        selectStatus(st || '완벽실천');
        document.getElementById('answerInput').value = existing.answer || '';
      } else {
        selectStatus('완벽실천');
        document.getElementById('answerInput').value = '';
      }

      showScreen('screen-detail');
    }

    function selectStatus(status) {
      selectedStatus = status;
      const btnDone = document.getElementById('btnStatusDone');
      const btnHalf = document.getElementById('btnStatusHalf');
      const btnFail = document.getElementById('btnStatusFail');

      btnDone.className = 'status-btn';
      btnHalf.className = 'status-btn';
      btnFail.className = 'status-btn';

      if (status === '완벽실천') {
        btnDone.className = 'status-btn selected-success';
      } else if (status === '조금아쉽') {
        btnHalf.className = 'status-btn selected-warning';
      } else if (status === '내일실천') {
        btnFail.className = 'status-btn selected-fail';
      }
    }

    function submitResponse() {
      const answer = document.getElementById('answerInput').value.trim();
      const targetTitle = document.getElementById('detailTargetTitle').innerText;

      // 추가 질문 서술 필수 검증(Validation)
      if (!answer) {
        alert("추가 질문에 대한 대답을 꼭 입력해 주세요!");
        document.getElementById('answerInput').focus();
        return;
      }

      const saveData = {
        status: selectedStatus,
        answer: answer,
        targetText: targetTitle,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref(`Responses/${todayStr}/${currentUser.code}/${selectedTargetKey}`).set(saveData, err => {
        if (err) {
          alert("저장 실패: " + err);
        } else {
          alert("✅ 제출되었습니다!");
          showScreen('screen-main');
        }
      });
    }
  </script>
</body>
</html>
